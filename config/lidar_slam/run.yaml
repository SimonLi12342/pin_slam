setting:
  name: "test_pin"
  output_root: "./experiments"
  deskew: True
process:
  min_range_m: 3.0
  max_range_m: 80.0
  vox_down_m: 0.08
  min_z_m: -3.5
  dynamic_filter_on: True
  dynamic_certainty_thre: 1.0
  dynamic_sdf_ratio_thre: 0.5
  dynamic_min_grad_norm_thre: 0.25
sampler:
  surface_sample_range_m: 0.25
neuralpoints:
  voxel_size_m: 0.4
  search_alpha: 0.5 # increase when you want to be more robust to agressive motions
continual:
  batch_size_new_sample: 1000
  pool_capacity: 1e7
  pool_filter_freq: 10
tracker:
  source_vox_down_m: 0.6
  iter_n: 50
  valid_nn_k: 5
pgo:
  map_context: True
  context_cosdist: 0.3
optimizer: # mapper
  batch_size: 10000
  adaptive_iters: True
eval:
  wandb_vis_on: False # log to wandb or not
  silence_log: False
  save_map: True
  save_mesh: True
